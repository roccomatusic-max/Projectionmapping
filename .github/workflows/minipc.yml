name: Mini PC app

on:
  push:
    branches: ["**"]
    paths: ["minipc/**", "camera-agent/**", ".github/workflows/minipc.yml"]
  pull_request:
    paths: ["minipc/**", "camera-agent/**", ".github/workflows/minipc.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. On the default branch runs queue, so releases
# are published in merge order and never race to replace the release; on other
# branches a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    name: Mini PC tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minipc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            minipc/requirements.txt
            camera-agent/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: python -m pytest -q tests

  windows:
    name: Mini PC Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the app and its installer
        shell: pwsh
        run: ./minipc/build.ps1 -Version "1.0.${{ github.run_number }}"
      - name: The built app starts and has everything it needs
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "minipc"
          $run = Start-Process dist\MiniPC\MiniPC.exe -ArgumentList "--check", "--data-dir", $data -Wait -PassThru
          $log = Get-Content (Join-Path $data "logs\minipc.log") -Raw
          Write-Output $log
          if ($run.ExitCode -ne 0) { throw "self-check failed with exit code $($run.ExitCode)" }
          # It updates itself by this number.
          if ($log -notmatch 'version 1\.0\.${{ github.run_number }};') { throw 'the app does not know its version' }
      - name: The install line explains Smart App Control instead of failing
        shell: powershell   # Windows PowerShell 5.1, what Rocco pastes the line into
        run: |
          $env:MINIPC_SETUP = (Resolve-Path dist\MiniPC-Setup.exe).Path
          $env:MINIPC_APP_CONTROL = '1'
          $out = Invoke-Expression (Get-Content minipc\install-minipc.ps1 -Raw) 6>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 1) { throw "exit code $LASTEXITCODE, expected 1" }
          if ($out -notmatch 'Smart App Control settings > Off') { throw 'the Smart App Control explanation is missing' }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Mini PC\MiniPC.exe") { throw 'it installed anyway' }
          $global:LASTEXITCODE = 0
      - name: The install line installs and starts the app
        shell: powershell
        run: |
          $env:MINIPC_SETUP = (Resolve-Path dist\MiniPC-Setup.exe).Path
          $env:MINIPC_APP_CONTROL = '0'
          $out = Invoke-Expression (Get-Content minipc\install-minipc.ps1 -Raw) 6>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
          $app = "$env:LOCALAPPDATA\Programs\Mini PC"
          if (-not (Test-Path "$app\MiniPC.exe")) { throw 'MiniPC.exe was not installed' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Mini PC.lnk")) { throw 'it does not start at sign-in' }
          $started = $false
          foreach ($i in 1..30) { if (Get-Process MiniPC -ErrorAction SilentlyContinue) { $started = $true; break }; Start-Sleep 1 }
          if (-not $started) { throw 'the app did not start after the install' }
          # Updating itself: the script the app hands over to installs over
          # the running copy without restarting Windows and starts it again.
          $work = Join-Path $env:RUNNER_TEMP 'selfupdate'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item dist\MiniPC-Setup.exe (Join-Path $work 'MiniPC-Setup-9.9.9.exe')
          $old = (Get-Process MiniPC | Select-Object -First 1).Id
          minipc\.venv\Scripts\python -c "import sys; sys.path.insert(0, 'minipc'); import selfupdate; open(sys.argv[1], 'w', encoding='utf-8').write(selfupdate.RUNNER)" (Join-Path $work 'install-update.ps1')
          $result = Join-Path $work 'result.json'
          $runner = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $work 'install-update.ps1'), '-Setup', (Join-Path $work 'MiniPC-Setup-9.9.9.exe'), '-AppPid', $old, '-App', "$app\MiniPC.exe", '-Result', $result, '-Version', '9.9.9') -PassThru
          # Not -Wait: that also waits for the app it starts, which never exits.
          $null = $runner.Handle
          if (-not $runner.WaitForExit(180000)) { throw 'the update script did not finish in 3 minutes' }
          Get-Content $result
          $outcome = Get-Content $result -Raw | ConvertFrom-Json
          if ($outcome.code -ne 0) { throw "the update's installer stopped with code $($outcome.code): $($outcome.error)" }
          $started = $false
          foreach ($i in 1..30) { $now = Get-Process MiniPC -ErrorAction SilentlyContinue; if ($now -and $now.Id -ne $old) { $started = $true; break }; Start-Sleep 1 }
          if (-not $started) { throw 'the app did not start again after updating itself' }
          if (Test-Path (Join-Path $work 'MiniPC-Setup-9.9.9.exe')) { throw 'the downloaded installer was left behind' }
          & "$app\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          foreach ($i in 1..30) { if (-not (Test-Path "$app\MiniPC.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$app\MiniPC.exe") { throw 'the uninstaller left MiniPC.exe behind' }
          Get-Process chrome, msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: MiniPC-Setup
          path: dist/MiniPC-Setup.exe
          if-no-files-found: error

  release:
    name: Publish the installer
    # Only what is merged reaches the mini PCs.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MiniPC-Setup
      - name: Replace the minipc-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          # What main servers read to hand the update to their mini PCs
          # (backend/app/services/minipc_updates.py).
          printf '{"version": "%s", "sha256": "%s", "size": %s, "commit": "%s"}\n' "$VERSION" \
            "$(sha256sum MiniPC-Setup.exe | cut -d' ' -f1)" "$(stat -c %s MiniPC-Setup.exe)" "$GITHUB_SHA" \
            > minipc-version.json
          cat minipc-version.json
          gh release delete minipc-latest --cleanup-tag --yes || true
          gh release create minipc-latest MiniPC-Setup.exe minipc/install-minipc.ps1 minipc-version.json \
            --target "$GITHUB_SHA" \
            --title "Mini PC app $VERSION" \
            --notes "For each Windows computer beside a projector (not the main server). Install: open PowerShell on the mini PC, paste the line from minipc/README.md and press Enter; it checks for Smart App Control first. Running MiniPC-Setup.exe by hand works too. Built from ${GITHUB_SHA::7}."
