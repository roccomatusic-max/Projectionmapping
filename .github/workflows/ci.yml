name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app simulator tests
      - run: python -m pytest -q
      - name: Migrations apply and reverse on SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
          SECRET_KEY: ci-only-secret-key-at-least-32-characters
        run: |
          mkdir -p data
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  homeassistant:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ha-tests/requirements.txt
      # Two environments: Home Assistant pins its own versions of shared
      # libraries, so the server runs in its own (ha-tests/conftest.py).
      - name: The server, in its own environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements-dev.txt
      - name: Home Assistant and its test harness
        run: pip install -q -r ha-tests/requirements.txt
      - name: Lint
        run: backend/.venv/bin/ruff check --config backend/ruff.toml custom_components ha-tests
      - name: The integration inside Home Assistant, against the server and simulators
        working-directory: ha-tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  camera-agent:
    name: Camera agent tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: camera-agent/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: python -m pytest -q tests

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose file is valid
        run: |
          SECRET_KEY=ci POSTGRES_PASSWORD=ci docker compose config --quiet
          SECRET_KEY=ci POSTGRES_PASSWORD=ci docker compose \
            -f docker-compose.yml -f docker-compose.simulator.yml config --quiet
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: projector-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and serves the UI and API
        # The empty variables are what docker-compose.yml passes when .env leaves them unset.
        run: |
          docker run -d --name pc -p 8000:8000 \
            -e SECRET_KEY=ci-only-secret-key-at-least-32-characters \
            -e DATABASE_URL=sqlite+aiosqlite:////app/data/ci.db \
            -e BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password \
            -e ALERT_EMAIL_TO= -e SMTP_HOST= -e SCHEDULE_TIMEZONE= \
            projector-control:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break || sleep 1
          done
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          # Files from frontend/public, not the page that unknown paths fall back to.
          curl -sf http://localhost:8000/remote-manifest.json | grep -q '"start_url"'
          curl -sf http://localhost:8000/media-sw.js | grep -q 'Media cache for players'
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/projectors/drivers \
            | grep -q panasonic_pt_dz13k
          docker logs pc | tail -20
          docker rm -f pc
