# Projector Control — local deployment.
#
# Two services: the API (which also serves the web UI) and PostgreSQL.
# Nothing is exposed to the internet. Remote access is via VPN — see
# docs/DEPLOYMENT.md §Remote access.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-projector}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projector}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not published to the host: only the API container reaches the database.
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        WITH_MQTT: ${WITH_MQTT:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projector}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-projector}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The scheduler reads "20:30" in this zone. Containers default to UTC,
      # which is almost never what a show schedule means.
      TZ: ${TZ:-UTC}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      POLL_CONNECTIVITY: ${POLL_CONNECTIVITY:-10}
      POLL_OPERATIONAL: ${POLL_OPERATIONAL:-15}
      POLL_DIAGNOSTICS: ${POLL_DIAGNOSTICS:-60}
      POLL_MAINTENANCE: ${POLL_MAINTENANCE:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-projector}
      MQTT_ALLOW_COMMANDS: ${MQTT_ALLOW_COMMANDS:-false}
    ports:
      # Bound to a single interface by default. Set BIND_ADDRESS to your
      # LAN or VPN address; 0.0.0.0 would publish the control UI on every
      # interface the host has, which is not what you want on a show network.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
    volumes:
      - api-data:/app/data

volumes:
  db-data:
  api-data:
